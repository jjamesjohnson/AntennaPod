name: Release APK

on:
  push:
    branches: [feature/smart-playlists]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}-${{ hashFiles('**/gradle-wrapper/gradle-wrapper.properties') }}

      - name: Configure parallel build
        run: echo "org.gradle.parallel=true" >> local.properties

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > app/keystore
          chmod 600 app/keystore
          cp app/keystore app-wearos/keystore

      - name: Build release APK
        run: ./gradlew assemblePlayRelease

      - name: Prepare APK asset
        run: cp app/build/outputs/apk/play/release/app-play-release.apk AntennaPod-Release.apk

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ci-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" AntennaPod-Release.apk \
            --title "AntennaPod CI build #${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --generate-notes
